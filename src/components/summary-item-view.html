<import from="@tabler/icons-webfont/dist/tabler-icons.min.css"></import>
<import from="./editable-label"></import>
<div class="summary-item-container">
  <div class="text-content">
    <p>
      <editable-label class="editable-label" view-model.ref="contentLabel" value.bind="summary.summaryContent" edit-element="textarea"></editable-label>
    </p>
    <span class="summary-order">${summary.order}</span>
  </div>
  <div class="button-group">
    <button class="icon-button edit-button" title="Edit" aria-label="Edit" click.trigger="contentLabel.startEdit()" disabled.bind="contentLabel.editing">
      <i class="ti ti-pencil-minus"></i>
    </button>
    <button class="icon-button provenance-button" title="History" aria-label="History">
      <i class="ti ti-history"></i>
    </button>
  </div>
</div>
